<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Dungeon</title>
<meta name="description" content="끝없이 아래로 이어지는 던전을 탐험하는 픽셀 아트 액션 로그라이크">
<meta name="theme-color" content="#0b0b10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dungeon">
<style>
  html, body { margin: 0; height: 100%; background: #0b0b10; overflow: hidden; cursor: none; } /* 게임 화면 밖 여백에서도 마우스 커서 숨김 (조준선만 보이게) */
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; cursor: none; }
  /* 로그인 화면 */
  #login { cursor: auto; position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8,6,14,0.78);
    font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif; z-index: 10; }
  .lg-panel { width: min(360px, calc(100vw - 32px)); background: #1c1828; border: 2px solid #4b3f5c; box-shadow: 0 0 0 4px #14101c, 0 12px 40px rgba(0,0,0,0.6);
    padding: 24px 20px 16px; color: #e8e0f0; display: flex; flex-direction: column; gap: 8px; }
  .lg-title { font-size: 26px; font-weight: 900; letter-spacing: 1px; text-align: center; color: #ffd84a; text-shadow: 3px 3px 0 #7a3a10; }
  .lg-sub { text-align: center; color: #a898c0; font-size: 13px; margin-bottom: 8px; }
  .lg-h { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .lg-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; margin-bottom: 4px; }
  .lg-row { display: flex; gap: 6px; }
  .lg-prof { flex: 1; display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #2a2440; color: #fff;
    border: 2px solid #3e345a; cursor: pointer; font: inherit; font-size: 15px; }
  .lg-prof span { color: #a898c0; font-size: 12px; }
  .lg-prof:hover, .lg-prof:focus-visible { border-color: #ffd84a; outline: none; }
  .lg-del { width: 40px; background: #2a2440; color: #c88; border: 2px solid #3e345a; cursor: pointer; font-size: 14px; }
  .lg-del:hover { border-color: #e05050; color: #ff7070; }
  .lg-btn { padding: 10px; background: #2a2440; color: #e8e0f0; border: 2px solid #3e345a; cursor: pointer; font: inherit; font-size: 14px; }
  .lg-btn:hover, .lg-btn:focus-visible { border-color: #a898c0; outline: none; }
  .lg-main { background: #6a4a1a; border-color: #c89a40; color: #fff; font-weight: 700; }
  .lg-main:hover { border-color: #ffd84a; }
  .lg-admin { font-size: 12px; color: #ffd84a; border-style: dashed; }
  .lg-danger { background: #6a1a2a; border-color: #c04050; color: #fff; }
  .lg-in { padding: 10px; background: #120e1c; color: #fff; border: 2px solid #3e345a; font: inherit; font-size: 15px; }
  .lg-in:focus { border-color: #ffd84a; outline: none; }
  .lg-err { color: #ff8080; font-size: 13px; min-height: 16px; }
  .lg-msg { color: #ffd0a0; font-size: 13px; }
  .lg-empty { color: #8878a0; text-align: center; padding: 12px; font-size: 13px; }
  .lg-note { color: #6a5a80; font-size: 11px; text-align: center; margin-top: 6px; }
  .lg-cont { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 12px 14px; background: #3a2c14; color: #fff;
    border: 2px solid #c89a40; cursor: pointer; font: inherit; text-align: left; }
  .lg-cont:hover, .lg-cont:focus-visible { border-color: #ffd84a; background: #4a3818; outline: none; }
  .lg-cont-t { font-size: 16px; font-weight: 700; color: #ffd84a; }
  .lg-prof { flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
  .lg-sum { color: #a898c0; font-size: 12px; }
  .lg-run { color: #7ad0ff; font-weight: 700; }
  .lg-cap { color: #8878a0; font-size: 12px; margin-top: 4px; }
  .lg-chk { display: flex; align-items: center; gap: 6px; color: #c8b8e0; font-size: 13px; cursor: pointer; user-select: none; }
  .lg-chk input { width: 16px; height: 16px; accent-color: #c89a40; }
  .lg-pin { letter-spacing: 6px; text-align: center; font-size: 18px; }
  .lg-pin::placeholder { letter-spacing: 0; font-size: 14px; }
</style>
